<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GOREBOUND — The Broken Oath</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0b;color:#eee;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;top:12px;left:12px;background:#0b0d0de8;border:1px solid #745c3d;border-radius:5px;padding:9px 12px;box-shadow:0 3px 20px #0009}.brand b{letter-spacing:2px}.brand small{color:#bcb3a6}.status{position:absolute;right:12px;top:12px;background:#0b0d0de8;border:1px solid #46555b;border-radius:5px;padding:8px 11px;font-size:12px}.skills{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;max-width:96vw}.skills button{min-width:92px;background:linear-gradient(#252321,#111);color:#eee;border:1px solid #806848;border-bottom:3px solid #59462f;border-radius:7px;padding:9px 8px;font-size:11px;font-weight:800;letter-spacing:.3px}.skills button:last-child{border-color:#c5a154;box-shadow:0 0 12px #b6872f44}.skills button:active{transform:translateY(2px);border-bottom-width:1px}.hint{position:absolute;left:50%;bottom:65px;transform:translateX(-50%);background:#0009;border-radius:12px;padding:5px 9px;font-size:11px;color:#c9c9c9}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#080a0b;z-index:5}.loader div{text-align:center}.loader b{letter-spacing:3px}.bar{width:220px;height:4px;background:#242424;margin-top:12px}.bar i{display:block;height:100%;width:5%;background:#a6844e;transition:width .2s}@media(max-width:720px){.brand{font-size:11px}.status{font-size:10px}.skills button{min-width:0;padding:8px 6px;font-size:9px}.hint{bottom:58px}}</style></head><body><div class="loader" id="loader"><div><b>GOREBOUND</b><br><small>Awakening Garren Vale…</small><div class="bar"><i id="bar"></i></div></div></div><div class="hud"><div class="brand"><b>GOREBOUND</b><br><small>THE BROKEN OATH · TRUE 3D SLICE</small></div><div class="status" id="status">GARREN VALE · CONVICTION 0/100</div><div class="hint">Drag: orbit · Pinch: zoom · Tap an ability</div><div class="skills"><button data-a="Walking">MOVE</button><button data-a="Sword_Judgment">OATHBLADE</button><button data-a="Shield_Push_Left">SHIELD RUSH</button><button data-a="Sword_Parry_Backward_2">DEFEND</button><button data-a="Sword_Shout">OATH UNBROKEN</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x080a0b);scene.fog=new THREE.FogExp2(0x080a0b,.045);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(8,6.5,10);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.5,0);controls.enableDamping=true;controls.enablePan=false;controls.minPolarAngle=.45;controls.maxPolarAngle=1.35;controls.minDistance=5;controls.maxDistance=16;scene.add(new THREE.HemisphereLight(0x91a9b7,0x160e0b,1.8));const key=new THREE.DirectionalLight(0xffd6a0,3.5);key.position.set(5,9,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const rim=new THREE.PointLight(0x6aa9b9,12,18);rim.position.set(-5,3,-4);scene.add(rim);const stone=new THREE.MeshStandardMaterial({color:0x292825,roughness:.95});const floor=new THREE.Mesh(new THREE.BoxGeometry(16,.45,12),stone);floor.position.y=-.28;floor.receiveShadow=true;scene.add(floor);for(let x=-6;x<=6;x+=2)for(let z=-4;z<=4;z+=2){if(Math.random()<.16)continue;const tile=new THREE.Mesh(new THREE.BoxGeometry(1.82,.1,1.82),new THREE.MeshStandardMaterial({color:Math.random()>.5?0x34312c:0x2e2d29,roughness:1}));tile.position.set(x,-.015,z);tile.rotation.y=(Math.random()-.5)*.08;tile.receiveShadow=true;scene.add(tile)}for(const [x,z,h] of[[-6,-4,4.5],[6,-4,3.7],[-6,4,3.8],[6,4,4.6]]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.45,.68,h,8),stone);p.position.set(x,h/2-.05,z);p.castShadow=true;scene.add(p)}const altar=new THREE.Mesh(new THREE.BoxGeometry(3,.65,1.5),stone);altar.position.set(0,.3,-4.3);scene.add(altar);let mixer=null,current=null,actions={};const loaderEl=document.querySelector('#loader'),bar=document.querySelector('#bar'),status=document.querySelector('#status');const gl=new GLTFLoader();gl.load('./assets/garren.glb',g=>{const hero=g.scene;const initial=new THREE.Box3().setFromObject(hero),sz=initial.getSize(new THREE.Vector3());const scale=3.25/Math.max(sz.y,.001);hero.scale.setScalar(scale);scene.add(hero);const box=new THREE.Box3().setFromObject(hero),center=box.getCenter(new THREE.Vector3());hero.position.x-=center.x;hero.position.z-=center.z;hero.position.y-=box.min.y;hero.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false}});mixer=new THREE.AnimationMixer(hero);g.animations.forEach(c=>actions[c.name]=mixer.clipAction(c));play(actions.restpose?'restpose':g.animations[0]?.name);loaderEl.remove();},e=>{if(e.total)bar.style.width=Math.round(e.loaded/e.total*100)+'%'},e=>{console.error(e);loaderEl.innerHTML='<div><b>MODEL LOAD FAILED</b><br><small>Check assets/garren.glb</small></div>'});function play(name){const a=actions[name];if(!a)return;current?.fadeOut(.16);a.reset().fadeIn(.16).play();current=a;if(name!=='restpose'&&name!=='Walking'&&name!=='Running'){a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true;const ms=Math.max(550,a.getClip().duration*1000);setTimeout(()=>play(actions.restpose?'restpose':name),ms)}}document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.a;status.textContent='GARREN VALE · '+b.textContent;play(n)}));const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);mixer?.update(Math.min(clock.getDelta(),.05));controls.update();renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
